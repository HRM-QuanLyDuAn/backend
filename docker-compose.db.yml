services:
  # ============================================================================
  # CƠ SỞ DỮ LIỆU ĐỘC LẬP CHO TỪNG DỊCH VỤ (Database-per-Service SOA)
  # Mỗi service sở hữu 1 Postgres riêng biệt (node, volume, port độc lập 5433-5437).
  # ============================================================================

  db-identity: # A — 4001
    image: postgres:16-alpine
    container_name: hrm-db-identity
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrm_identity
    ports:
      - "5433:5432"
    volumes:
      - hrm-identity-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrm-network

  db-organization: # B — 4002
    image: postgres:16-alpine
    container_name: hrm-db-organization
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrm_organization
    ports:
      - "5434:5432"
    volumes:
      - hrm-organization-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrm-network

  db-work: # B — 4003
    image: postgres:16-alpine
    container_name: hrm-db-work
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrm_work
    ports:
      - "5435:5432"
    volumes:
      - hrm-work-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrm-network

  db-payroll: # D — 4004
    image: postgres:16-alpine
    container_name: hrm-db-payroll
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrm_payroll
    ports:
      - "5436:5432"
    volumes:
      - hrm-payroll-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrm-network

  db-integration: # E — 4005
    image: postgres:16-alpine
    container_name: hrm-db-integration
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrm_integration
    ports:
      - "5437:5432"
    volumes:
      - hrm-integration-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrm-network

networks:
  hrm-network:
    name: hrm-network
    driver: bridge

volumes:
  hrm-identity-pgdata:
  hrm-organization-pgdata:
  hrm-work-pgdata:
  hrm-payroll-pgdata:
  hrm-integration-pgdata:
